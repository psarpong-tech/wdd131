<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>

    <meta name="description" content="Product review form for sharing feedback about a product">
    <meta name="author" content="Priscilla Gyasiwaa Sarpong">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <fieldset>
                <label for="productName">Product Name*</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product...</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Overall Rating*</legend>

                <div class="rating">
                    <label for="rating1">☆<input type="radio" id="rating1" name="rating" value="1" required></label>
                    <label for="rating2">☆☆<input type="radio" id="rating2" name="rating" value="2" required></label>
                    <label for="rating3">☆☆☆<input type="radio" id="rating3" name="rating" value="3" required></label>
                    <label for="rating4">☆☆☆☆<input type="radio" id="rating4" name="rating" value="4" required></label>
                    <label for="rating5">☆☆☆☆☆<input type="radio" id="rating5" name="rating" value="5" required></label>
                </div>
            </fieldset>

            <label for="installDate">Date of Installation*</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>
                    Which features did you find useful?
                    <span>(Check all that apply)</span>
                </legend>

               <label for="durability">
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    Durability
                </label>

                <label for="easeOfUse">
                    <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label for="performance">
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox" id="design" name="features" value="Design">
                    Design
                </label>
            </fieldset>

            <label for="writtenReview">Written Review <span>(Optional)</span></label>
            <textarea id="writtenReview" name="writtenReview"></textarea>

            <label for="userName">Your Name <span>(Optional)</span></label>
            <input type="text" id="userName" name="userName" autocomplete="name">
            
            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>©️ <span id="currentyear"></span> 🌴 Priscilla Gyasiwaa Sarpong 🌴 Ghana</p>
        <p id="lastModified">Last Modification:</p>

</footer>

</body>
</html>
